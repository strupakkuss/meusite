<title>Toque na tela</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
    overflow: hidden;
  }
  img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .15s ease;
  }
  body.tocando img { animation: tremer .35s ease-in-out infinite; }
  @keyframes tremer {
    0%, 100% { transform: scale(1.03) translate(0, 0); }
    25% { transform: scale(1.05) translate(-4px, 2px); }
    75% { transform: scale(1.05) translate(4px, -2px); }
  }
  #dica {
    position: fixed; left: 0; right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #fff; font: 600 1rem system-ui, sans-serif;
    text-shadow: 0 1px 6px rgba(0,0,0,.8); pointer-events: none;
    transition: opacity .3s;
  }
  body.tocando #dica { opacity: 0; }
</style>

<script>
  // O navegador só libera som depois de um toque do usuário,
  // então o áudio começa no primeiro toque em qualquer lugar da tela.
  var som = document.getElementById("som");
  var b64 = som.getAttribute("src").split(",")[1];
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  var ctx = null, buffer = null, fonte = null;

  function fim() { document.body.classList.remove("tocando"); }

  // Plano B: decodifica o mp3 e toca via Web Audio (não depende do <audio>)
  function tocarWebAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    function rodar() {
      if (fonte) { try { fonte.stop(); } catch (e) {} }
      fonte = ctx.createBufferSource();
      fonte.buffer = buffer;
      fonte.connect(ctx.destination);
      fonte.onended = fim;
      fonte.start(0);
    }
    if (buffer) { rodar(); return; }
    ctx.decodeAudioData(bytes.buffer.slice(0), function (b) {
      buffer = b; rodar();
    }, function () {});
  }

  function tocar() {
    document.body.classList.add("tocando");
    try {
      var blob = new Blob([bytes], { type: "audio/mpeg" });
      if (!som.dataset.blob) {
        som.src = URL.createObjectURL(blob);
        som.dataset.blob = "1";
      }
      som.currentTime = 0;
      var p = som.play();
      if (p && p.catch) p.catch(tocarWebAudio);
    } catch (e) {
      tocarWebAudio();
    }
  }
  som.addEventListener("error", function () { if (som.dataset.blob) tocarWebAudio(); });
  som.addEventListener("ended", fim);
  document.addEventListener("pointerdown", tocar);
</script>
